name: Pre-Commit Hygiene

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGY_OFFLINE_ONLY: "1"
      PRE_COMMIT_HOOK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-v1|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-v1|${{ runner.os }}|
      - name: Install pre-commit
        run: python3 -m pip install --upgrade pip pre-commit
      - name: Run pre-commit repository hygiene & secret hooks
        env:
          SKIP: qa-static-audit,unit-tests-fast,bats-suite
        run: pre-commit run --all-files --show-diff-on-failure
