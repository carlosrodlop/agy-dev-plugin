name: Offline Unit Tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bats-core (Debian package)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats
      - name: Run Offline Unit Tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Run Shell BATS Tests
        run: bats tests/bats/*.bats
