name: Static QA & Zero-PII Audit

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  static-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run Static Engineering & Zero-PII Audit
        run: python3 ./tests/scripts/qa_static_audit.py --strict
