name: Static QA & Zero-PII Audit

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  static-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AGY_OFFLINE_ONLY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install QA dependencies
        run: python3 -m pip install --upgrade pip pyyaml ruff
      - name: Run Ruff Python syntax & undefined-name checks
        run: ruff check --select E9,F63,F7,F82 clients skills sidecars tests
      - name: Run Static Engineering & Zero-PII Audit
        run: python3 tests/scripts/qa_static_audit.py --strict
