name: Coverage Report

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev test dependencies
        run: python3 -m pip install --upgrade pip pytest pytest-cov
      - name: Run pytest with coverage
        run: python3 -m pytest tests/ --cov=clients --cov=skills --cov-report=term-missing
