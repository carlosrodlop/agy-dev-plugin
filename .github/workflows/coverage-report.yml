name: Coverage Report

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGY_OFFLINE_ONLY: "1"
      PRE_COMMIT_HOOK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install dev test & coverage dependencies
        run: python3 -m pip install --upgrade pip pyyaml pytest pytest-cov coverage
      - name: Run pytest with coverage & publish Markdown summary
        run: |
          python3 -m pytest tests/ \
            --cov=clients \
            --cov=skills \
            --cov=sidecars \
            --cov=tests/scripts \
            --cov-report=term-missing \
            --cov-fail-under=75
          {
            echo "## 🧪 Hermetic Offline Coverage Report (\`>= 75%\` Gate)"
            echo ""
            python3 -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
