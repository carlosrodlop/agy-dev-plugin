[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-dev-plugin"
version = "20261122+g8397a91"
description = "Antigravity Dev & SDLC Plugin: VCS-interoperable native Git PR remediation, dev queue orchestration, static QA/Zero-PII auditing, and engineering best-practice guardrails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
agy-queue = "dev_common:run_dev_queue_tui_cli"
agy-doctor = "dev_common:run_dev_queue_doctor_cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "coverage>=7.6",
    "pre-commit>=3.5.0",
    "ruff>=0.6.0",
    "yamllint>=1.35.0",
]

[tool.setuptools]
package-dir = {"" = "clients"}
py-modules = ["dev_common", "git_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
order-by-type = true
